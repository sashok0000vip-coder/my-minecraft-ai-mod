name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    # Мы явно указываем версию Gradle (8.2), чтобы GitHub не искал файл gradlew в репозитории
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    # Собираем мод глобальным установленным Gradle, а не локальным скриптом
    - name: Build with Gradle
      run: gradle jar

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-AI-Mod
        path: build/libs/*.jar
